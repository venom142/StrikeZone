name: StrikeZone Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "strikezone/**"
      - ".github/workflows/strikezone-android.yml"

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.4.1"
      PROJECT_PATH: "strikezone"
      EXPORT_NAME: "StrikeZoneMobile"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and Android export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
          mkdir -p ~/.config/godot
          printf '[android]\nandroid_sdk_path = "/opt/android-sdk"\n' > ~/.config/godot/editor_settings-4.tres

      - name: Install Android SDK packages
        run: |
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android APK
        run: |
          mkdir -p build/android
          cd "${PROJECT_PATH}"
          godot --headless --path . --export-debug "Android" "../build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeZone-Mobile-APK
          path: build/android/StrikeZoneMobile.apk
