name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, mobile-full-build ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Download Godot 4.5.2
        run: |
          curl -L --fail -o godot.zip https://downloads.godotengine.org/4.5.2/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot_bin
          chmod +x godot_bin/Godot_v4.5.2-stable_linux.x86_64
      - name: Install Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.2.stable
          curl -L --fail -o templates.tpz https://downloads.godotengine.org/4.5.2/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.5.2.stable/
      - name: Validate project files
        run: python3 tools/validate_project.py
      - name: Parse project headless
        run: ./godot_bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Export debug APK
        run: |
          mkdir -p build/android
          ./godot_bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --export-debug Android build/android/StrikeZoneMobile.apk
      - name: Verify APK
        run: test -s build/android/StrikeZoneMobile.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeZoneMobile-Android
          path: build/android/StrikeZoneMobile.apk
