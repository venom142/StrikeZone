name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, mobile-full-build ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Verify Android SDK
        run: |
          set -eux
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"

      - name: Download Godot 4.5.2
        run: |
          set -eux
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot_bin
          chmod +x godot_bin/Godot_v4.5.2-stable_linux.x86_64

      - name: Install Godot Android export templates
        run: |
          set -eux
          mkdir -p ~/.local/share/godot/export_templates/4.5.2.stable
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          test -d templates/templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.5.2.stable/
          test -f ~/.local/share/godot/export_templates/4.5.2.stable/android_debug.apk

      - name: Validate project files
        run: python3 tools/validate_project.py

      - name: Parse project headless
        run: ./godot_bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          set -eux
          mkdir -p build/android
          ./godot_bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --export-debug Android build/android/StrikeZoneMobile.apk

      - name: Verify APK
        run: |
          set -eux
          test -s build/android/StrikeZoneMobile.apk
          file build/android/StrikeZoneMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeZoneMobile-Android
          path: build/android/StrikeZoneMobile.apk
